<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050711">
<title>Процедурная туманность</title>
<style>
  html, body { margin: 0; height: 100%; background: #050711; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
  #status { position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
            margin: 0; width: max-content; max-width: 85vw; color: #d5d8e7;
            font: 15px system-ui; text-align: center; }
  #status[hidden] { display: none; }
</style>
<canvas aria-label="Процедурное звёздное небо"></canvas>
<p id="status" role="status">Загружается генератор туманности…</p>
<noscript><style>#status { display: none; }</style>Для генерации неба нужен JavaScript.</noscript>
<script type="module" src="./wallpaper-page.js?v=5.1.0"></script>
</html>
